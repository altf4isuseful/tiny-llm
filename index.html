<!DOCTYPE html>
<!-- Chess Coach: save as chess-coach.html and open in a browser (needs internet for chess.js + Stockfish from cdnjs).
     Enter your TokenReply key in Settings. If the coach shows a CORS error, TokenReply may block direct browser calls:
     run a small proxy (e.g. Python Flask forwarding to https://api.tokenreply.com/v1) and set Base URL to it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Coach</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
:root{--bg:#f3efe6;--panel:#fbf9f3;--ink:#1d2421;--muted:#6c746f;--line:#d9d3c4;--accent:#2f6b4f;--light:#ebe3cc;--dark:#5f8a6e}
@media(prefers-color-scheme:dark){:root{--bg:#161b19;--panel:#1d2421;--ink:#e9ece7;--muted:#8e9892;--line:#2d3631;--accent:#6fbf93}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
h1{font:600 24px Georgia,serif;margin:0}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=number]{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
#status{color:var(--muted);font-size:14px}
.boardwrap{display:flex;gap:8px;max-width:640px}
#evalbar{width:20px;border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;background:#262626;flex-shrink:0}
#evalfill{position:absolute;left:0;right:0;background:#f5f5f5;transition:height .3s}
#board{flex:1;aspect-ratio:1;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:6px;overflow:hidden;user-select:none}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(7.5vw,52px);line-height:1;position:relative;cursor:pointer}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last{box-shadow:inset 0 0 0 100px rgba(214,170,60,.45)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(80,160,120,.5)}
.sq.tgt::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(47,107,79,.6);position:absolute}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.b{color:#111;text-shadow:0 0 1px #fff}
#moves{display:grid;grid-template-columns:2rem 1fr 1fr;gap:2px 8px;max-height:150px;overflow-y:auto;padding:10px;font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
aside{display:flex;flex-direction:column;height:80vh;min-height:420px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.me{margin-left:32px;background:rgba(47,107,79,.15);padding:6px 10px;border-radius:8px}
.err{color:#cc3b3b}.hint{color:var(--muted)}
#ask{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line)}#ask input{flex:1}
details{padding:10px}summary{cursor:pointer;font-weight:600}
details label{display:block;margin-top:8px;font-size:13px;color:var(--muted)}details input{width:100%;margin-top:2px;color:var(--ink)}
</style>
</head>
<body>
<main>
<section>
  <header><h1>Chess Coach</h1><span id="status">Loading Stockfish…</span></header>
  <div class="boardwrap"><div id="evalbar"><div id="evalfill" style="height:50%;bottom:0"></div></div><div id="board"></div></div>
  <div class="panel row" style="margin-top:12px">
    <button id="newBtn">New game</button><button id="backBtn">Take back</button><button id="flipBtn">Play as Black</button>
    <label>Engine level <b id="skillv">8</b> <input id="skill" type="range" min="0" max="20" value="8"></label>
    <label><input id="coachOn" type="checkbox" checked> Coach mode</label>
  </div>
  <div class="panel" id="moves" style="margin-top:12px"></div>
  <details class="panel" style="margin-top:12px"><summary>Load a PGN</summary>
    <label>Paste PGN <textarea id="pgn" rows="4" style="width:100%;background:transparent;color:inherit;border:1px solid var(--line);border-radius:6px"></textarea></label>
    <button id="pgnBtn" style="margin-top:8px">Load and analyze position</button>
  </details>
</section>
<aside class="panel">
  <details open><summary>Settings</summary>
    <label>TokenReply API key<input id="key" type="password" placeholder="paste your key" autocomplete="off"></label>
    <label>Model<input id="model" type="text" value="gpt-4o"></label>
    <label>Base URL<input id="base" type="text" value="https://api.tokenreply.com/v1"></label>
    <label>Your rating<input id="rating" type="number" value="1200" min="400" max="2800" step="50"></label>
    <label style="display:flex;gap:6px;align-items:center"><input id="remember" type="checkbox" style="width:auto"> Remember key on this device</label>
  </details>
  <div id="chat" aria-live="polite"><p class="hint">Add your API key above, then ask about the position (“What is the plan?”, “What threat did I miss?”). With Coach mode on, I comment after each of your moves.</p></div>
  <div id="ask"><input id="q" type="text" placeholder="Ask the coach…"><button id="askBtn">Ask</button></div>
</aside>
</main>

<script>
const SF_URL="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
const SYSTEM=`You are a friendly, patient chess coach. You explain chess in plain English and adapt depth to the student's rating.

GROUNDING RULES (most important):
- You are given Stockfish analysis: evaluation and top lines in SAN. Treat it as the only source of truth.
- Never invent moves, evaluations, or variations. Only mention moves that appear in the supplied lines or in the FEN/PGN.
- If the engine data does not answer the question, say so and explain only general ideas that clearly follow from the FEN.
- Eval is from White's point of view. Translate numbers into words ("slightly better", "winning", "roughly equal").

STYLE:
- Concise: 3-6 sentences unless asked for more. Encouraging, never condescending.
- Explain the idea behind the engine's choice: threats, piece activity, king safety, pawn structure, tactics.
- For a mistake or blunder: name what it allowed or missed, show the engine's better move, give one lesson.
- Rating under 1000: simple words, one idea. 1000-1600: name tactical motifs. Over 1600: plans, structure, concrete lines.
- End with one short takeaway or a question that makes the student think.`;

const $=id=>document.getElementById(id);
const G={"wk":"♔","wq":"♕","wr":"♖","wb":"♗","wn":"♘","wp":"♙","bk":"♚","bq":"♛","br":"♜","bb":"♝","bn":"♞","bp":"♟"};
let game=new Chess(), gameId=0, flipped=false, busy=false, selected=null, analysis=null, quality={}, engineOK=false;

/* ---------- Engine ---------- */
let sf, ready, chain=Promise.resolve();
async function initEngine(){
  try{
    const src=await (await fetch(SF_URL)).text();
    sf=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
    ready=new Promise(res=>{const h=e=>{const s=String(e.data);
      if(s==="uciok")sf.postMessage("isready");
      if(s==="readyok"){sf.removeEventListener("message",h);res();}};
      sf.addEventListener("message",h);sf.postMessage("uci");});
    await ready; engineOK=true; setStatus();
  }catch(e){$("status").textContent="Could not load Stockfish (check your internet connection)."}
}
const queue=t=>{const p=chain.then(()=>ready).then(t);chain=p.catch(()=>{});return p};
function uciToSan(fen,moves){const g=new Chess(fen),out=[];for(const m of moves){const r=g.move({from:m.slice(0,2),to:m.slice(2,4),promotion:m[4]});if(!r)break;out.push(r.san)}return out}
function search(fen,go,skill,mpv){return new Promise(resolve=>{
  const turn=fen.split(" ")[1]==="b"?-1:1, by={};
  const h=e=>{const s=String(e.data);
    if(s.startsWith("info")&&s.includes(" pv ")&&s.includes(" score ")){
      const t=s.split(" "),num=k=>+t[t.indexOf(k)+1],i=t.indexOf("score"),v=+t[i+2]*turn;
      const m=t.includes("multipv")?num("multipv"):1;
      by[m]={multipv:m,depth:num("depth"),pv:t.slice(t.indexOf("pv")+1),[t[i+1]==="mate"?"mate":"cp"]:v};
    }else if(s.startsWith("bestmove")){
      sf.removeEventListener("message",h);
      const lines=Object.values(by).sort((a,b)=>a.multipv-b.multipv);
      lines.forEach(l=>l.san=uciToSan(fen,l.pv.slice(0,8)));
      resolve({lines,best:s.split(" ")[1]});
    }};
  sf.addEventListener("message",h);
  sf.postMessage("setoption name Skill Level value "+skill);
  sf.postMessage("setoption name MultiPV value "+mpv);
  sf.postMessage("position fen "+fen);sf.postMessage(go);
})}
const analyze=(fen,depth=14)=>queue(async()=>{const r=await search(fen,"go depth "+depth,20,3);return{fen,lines:r.lines,best:r.best,bestSan:r.lines[0]?.san[0]}});
const enginePlay=(fen,skill)=>queue(async()=>(await search(fen,"go movetime 700",skill,1)).best);

/* ---------- Eval helpers ---------- */
const cpOf=l=>!l?0:l.mate!==undefined?Math.sign(l.mate)*10000:l.cp;
const winPct=l=>50+50*(2/(1+Math.exp(-0.00368208*cpOf(l)))-1);
const evalText=l=>!l?"?":l.mate!==undefined?`mate in ${Math.abs(l.mate)} for ${l.mate>0?"White":"Black"}`:((l.cp>0?"+":"")+(l.cp/100).toFixed(2));
function classify(b,a,mover,playedBest){
  const s=mover==="w"?1:-1,loss=Math.max(0,s*(winPct(b)-winPct(a)));
  const q=playedBest||loss<1?"Best":loss<5?"Good":loss<10?"Inaccuracy":loss<20?"Mistake":"Blunder";
  return{q,cpLoss:Math.round(Math.max(0,s*(cpOf(b)-cpOf(a))))};
}
const COLORS={Best:"#3f9b6a",Good:"#7aa874",Inaccuracy:"#d4a72c",Mistake:"#e07a2e",Blunder:"#cc3b3b"};

/* ---------- Rendering ---------- */
const userColor=()=>flipped?"b":"w";
function setStatus(){
  const s=!engineOK?"Loading Stockfish…":game.in_checkmate()?"Checkmate":game.in_draw()?"Draw":busy?"Thinking…":game.turn()===userColor()?"Your move":"Engine's move";
  $("status").textContent=s;
}
function render(){
  const hist=game.history({verbose:true}),last=hist[hist.length-1];
  const targets=selected?game.moves({square:selected,verbose:true}).map(m=>m.to):[];
  let html="";
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const f=flipped?7-c:c,rk=flipped?r:7-r,sq="abcdefgh"[f]+(rk+1),p=game.get(sq);
    const cls=["sq",(f+rk)%2===0?"d":"l"];
    if(last&&(last.from===sq||last.to===sq))cls.push("last");
    if(sq===selected)cls.push("sel");
    if(targets.includes(sq))cls.push("tgt");
    html+=`<div class="${cls.join(" ")}" data-sq="${sq}">${p?`<span class="${p.color}">${G[p.color+p.type]}\uFE0E</span>`:""}</div>`;
  }
  $("board").innerHTML=html;
  const m=hist.map(x=>x.san);let mv="";
  for(let i=0;i<m.length;i+=2){mv+=`<span class="hint">${i/2+1}.</span>`;
    for(const j of[i,i+1])mv+=`<span>${m[j]?(quality[j]?`<i class="dot" style="background:${COLORS[quality[j]]}" title="${quality[j]}"></i>`:"")+m[j]:""}</span>`}
  $("moves").innerHTML=m.length?mv:'<span class="hint" style="grid-column:1/4">No moves yet. Click a piece, then a square.</span>';
  $("backBtn").disabled=busy||!m.length;
  setStatus();
}
function setEval(a){
  const w=a?winPct(a.lines[0]):50;
  const f=$("evalfill");f.style.height=w+"%";
  f.style.top=flipped?"0":"auto";f.style.bottom=flipped?"auto":"0";
  $("evalbar").style.background="#262626";
}

/* ---------- Coach ---------- */
function addMsg(text,cls=""){const d=document.createElement("div");d.className=cls;d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
function buildPrompt(a,extra){
  const lines=a.lines.map((l,i)=>`${i+1}. ${l.san.join(" ")} (eval ${evalText(l)})`).join("\n");
  const played=extra.played?`\nThe student just played ${extra.played.san}, rated ${extra.played.q} (about ${extra.played.cpLoss} centipawns lost). Engine's preferred move there: ${extra.played.bestSan||"same"}. Eval after their move: ${evalText(a.lines[0])}.`:"";
  return `Student rating: ${$("rating").value||"unknown"}
Position (FEN): ${a.fen}
Game so far (PGN): ${game.pgn()||"(none)"}
Stockfish evaluation: ${evalText(a.lines[0])}
Stockfish top lines:
${lines||"(none)"}${played}

Student's question: ${extra.question||(extra.played?"Comment on the move I just played.":"What should I be thinking about here?")}`;
}
async function askCoach(a,extra,userText){
  const key=$("key").value.trim();
  if(userText)addMsg(userText,"me");
  if(!key){addMsg("Add your TokenReply API key in Settings first.","err");return}
  const wait=addMsg("Coach is thinking…","hint");
  try{
    const r=await fetch($("base").value.replace(/\/$/,"")+"/chat/completions",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:$("model").value.trim(),temperature:.4,max_tokens:500,
        messages:[{role:"system",content:SYSTEM},{role:"user",content:buildPrompt(a,extra)}]})});
    if(!r.ok){wait.className="err";wait.textContent=r.status===401?"TokenReply rejected the API key.":r.status===429?"Rate limited. Wait a moment and try again.":`Coach error (HTTP ${r.status}).`;return}
    const d=await r.json();wait.className="";wait.textContent=d.choices?.[0]?.message?.content||"(empty reply)";
  }catch(e){wait.className="err";wait.textContent="Request failed. This is usually a CORS block from the browser or a wrong Base URL. See the note in the file header.";}
  $("chat").scrollTop=1e9;
}

/* ---------- Game flow ---------- */
async function engineReply(id){
  if(game.game_over())return;
  const uci=await enginePlay(game.fen(),+$("skill").value);
  if(id!==gameId||!uci)return;
  game.move({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]});render();
}
function tryMove(from,to){
  if(busy||!engineOK||game.game_over()||game.turn()!==userColor())return;
  const before=analysis,fenBefore=game.fen();
  const mv=game.move({from,to,promotion:"q"});
  if(!mv)return;
  selected=null;render();
  const id=gameId,idx=game.history().length-1;
  (async()=>{
    busy=true;setStatus();
    const b=before&&before.fen===fenBefore?before:await analyze(fenBefore);
    const a=await analyze(game.fen());
    if(id!==gameId)return;
    const best=b.best===from+to+(mv.promotion||"");
    const c=classify(b.lines[0],a.lines[0],mv.color,best);
    quality[idx]=c.q;analysis=a;setEval(a);render();
    if($("coachOn").checked)askCoach(a,{played:{san:mv.san,q:c.q,cpLoss:c.cpLoss,bestSan:b.bestSan}});
    await engineReply(id);
    if(id===gameId){analysis=await analyze(game.fen());setEval(analysis);busy=false;render()}
  })();
}
function reset(asBlack){
  gameId++;game=new Chess();analysis=null;quality={};busy=false;selected=null;setEval(null);render();
  if(asBlack){const id=gameId;busy=true;engineReply(id).then(()=>{if(id===gameId){busy=false;render()}})}
}
$("board").addEventListener("click",e=>{
  const el=e.target.closest(".sq");if(!el)return;const sq=el.dataset.sq,p=game.get(sq);
  if(selected&&selected!==sq&&!(p&&p.color===userColor())){tryMove(selected,sq);return}
  selected=p&&p.color===userColor()?sq:null;render();
});
$("newBtn").onclick=()=>reset(flipped);
$("flipBtn").onclick=()=>{flipped=!flipped;$("flipBtn").textContent="Play as "+(flipped?"White":"Black");reset(flipped)};
$("backBtn").onclick=()=>{
  if(busy)return;gameId++;game.undo();if(game.turn()!==userColor())game.undo();
  const n=game.history().length;for(const k in quality)if(+k>=n)delete quality[k];
  analysis=null;render();const id=gameId;
  analyze(game.fen()).then(a=>{if(id===gameId){analysis=a;setEval(a)}});
};
$("skill").oninput=e=>$("skillv").textContent=e.target.value;
$("pgnBtn").onclick=async()=>{
  const g=new Chess();
  if(!g.load_pgn($("pgn").value)){addMsg("That PGN could not be read.","err");return}
  gameId++;game=g;quality={};busy=false;selected=null;render();
  const id=gameId;analysis=await analyze(game.fen());if(id===gameId){setEval(analysis);addMsg("PGN loaded. Ask the coach about this position.","hint")}
};
function ask(){
  const q=$("q").value.trim();if(!q)return;
  if(!analysis){addMsg("The engine is still analyzing. Try again in a moment.","hint");return}
  $("q").value="";askCoach(analysis,{question:q},q);
}
$("askBtn").onclick=ask;$("q").addEventListener("keydown",e=>e.key==="Enter"&&ask());

/* ---------- Saved key ---------- */
try{const k=localStorage.getItem("cc_key");if(k){$("key").value=k;$("remember").checked=true}}catch{}
const persist=()=>{try{$("remember").checked?localStorage.setItem("cc_key",$("key").value):localStorage.removeItem("cc_key")}catch{}};
$("key").onchange=persist;$("remember").onchange=persist;

render();initEngine().then(async()=>{analysis=await analyze(game.fen());setEval(analysis)});
</script>
</body>
</html>
